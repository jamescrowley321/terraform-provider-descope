# Blind Peer Review — fresh-context, diff-only AI PR review. ON DEMAND ONLY.
# https://github.com/jamescrowley321/blind-peer-review
#
# This does NOT run automatically on pull requests, and "Merge Gate" is NOT a
# required check. Routine review happens locally, before the push, running the
# same lens library as isolated Claude Code subagents:
#
#     /plugin marketplace add jamescrowley321/blind-peer-review
#     /plugin install blind-peer-review
#     /blind-peer-review:check     # reviews the working diff against origin/main
#
# This workflow stays for the times a cloud second opinion is wanted on an open
# PR: run it from the Actions tab with the PR number.
#
# Why it is not automatic: the action posts a GitHub review per lens on every
# run, and a lens with zero findings still posts one — it anchors a synthetic
# "See the review summary." inline comment on the first changed line (v3.0.0
# action.yml, the `if (!comments.length)` fallback). There is no input that
# suppresses posting, so six lenses times every push put review comments on
# every PR regardless of whether anything was found. Nothing gated on them:
# "Merge Gate" was never added to branch protection in this repo.
#
# Setup: repo secret OPENROUTER_API_KEY. Toggle lenses in the ENABLED list below
# (one source of truth for the matrix + gate). Action pinned to a SHA (v3.0.0).

name: Blind Peer Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the open PR to review'
        required: true
        type: string

# Keyed on the PR, not github.ref: a dispatch always runs on a branch ref (main,
# normally), so keying on the ref would make two reviews of two different PRs
# cancel each other.
concurrency:
  group: blind-peer-review-${{ inputs.pr_number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read

jobs:
  config:
    runs-on: ubuntu-latest
    permissions: {} # computes the lens matrix only — no API access needed
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            cold_read  # logic bugs, footguns (zero context)
            edge_case  # unhandled branches / boundaries
            acceptance # PR acceptance criteria met + tested
            security   # exploitable security vulnerabilities
            red_team   # red-team attack paths (auth/infra)
            policy     # AI-provenance policy + repo rules
        run: |
          const NAMES = {
            cold_read: "Cold Read", "edge_case": "Edge Cases",
            acceptance: "Acceptance Criteria", security: "Security Review", red_team: "Red Team",
            policy: "Policy & Provenance",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) {
            core.setFailed("ENABLED must list at least one lens; an empty matrix would fail workflow validation with an opaque error.");
            return;
          }
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No owner/fork guard is needed any more: workflow_dispatch requires write
    # access on this repo, so a fork, an outside contributor or a bot cannot
    # start this workflow at all. The old guard read
    # github.event.pull_request.author_association, which is empty on a dispatch
    # — it would evaluate false and skip every lens.
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          # One check name per line — v3.0.0 stopped splitting this input on
          # commas, because a check name may legally contain one. The old comma
          # form parses as a SINGLE check literally named
          # "Run Linter, Unit Tests, Check Leaks, gosec", which never reports,
          # so preflight can only end in its 600s timeout and the Merge Gate
          # then fails closed on every PR.
          required_checks: |
            Run Linter
            Unit Tests
            Check Leaks
            gosec

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: anthropic/claude-sonnet-5
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "anthropic/claude-sonnet-5": {
                      "compat": { "openRouterRouting": { "sort": "price", "zdr": true } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run so the required "Merge Gate" check is never absent or skipped.
    # Branch protection treats a skipped required check as passing, so a gate
    # that skips for non-owner PRs (whose review is skipped) would let them merge
    # with zero review. Fail closed instead — non-owner PRs require manual review.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      # review is 'skipped' for non-owner PRs (only owner PRs are auto-reviewed)
      # and 'failure' if a lens leg crashed. Either way, don't adjudicate a
      # partial/absent lens set — fail closed so the owner reviews and merges.
      - name: Fail closed when review did not complete
        if: needs.review.result != 'success'
        run: |
          echo "::error::Blind peer review did not complete (review=${{ needs.review.result }}): preflight failed, or one or more lenses crashed. Nothing was adjudicated — re-run the dispatch, or review locally with /blind-peer-review:check."
          exit 1
      - name: Adjudicate lenses
        if: needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
